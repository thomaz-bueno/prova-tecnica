spring:
  application:
    name: gateway-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/gateway_db}
    username: ${GATEWAY_DB_USERNAME:gateway_dev}
    password: ${GATEWAY_DB_PASSWORD:gateway_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${GATEWAY_DDL_AUTO:update}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:gateway-api}
  seed-test-user: ${GATEWAY_SEED_TEST_USER:false}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

orders:
  api:
    url: ${ORDERS_API_URL:http://localhost:8081}
    connect-timeout: ${ORDERS_API_CONNECT_TIMEOUT:2s}
    timeout: ${ORDERS_API_TIMEOUT:5s}

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true
    persist-authorization: false
  paths-to-match: /auth/login

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    reactor.netty.http.client: INFO
