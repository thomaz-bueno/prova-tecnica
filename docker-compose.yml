x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: ${GATEWAY_DB_USERNAME:-gateway_dev}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?Set GATEWAY_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${GATEWAY_DB_PORT:-5432}:5432"
    volumes:
      - gateway-postgres-data:/var/lib/postgresql/data
    networks:
      - auth-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  orders-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${ORDERS_DB_USERNAME:-orders_dev}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ORDERS_DB_PORT:-5433}:5432"
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data
    networks:
      - orders-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  orders-api:
    restart: unless-stopped
    build:
      context: ./orders-api
    environment:
      ORDERS_DB_URL: jdbc:postgresql://orders-db:5432/orders_db
      ORDERS_DB_USERNAME: ${ORDERS_DB_USERNAME:-orders_dev}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}
      ORDERS_DDL_AUTO: ${ORDERS_DDL_AUTO:-update}
      ORDERS_SERVER_ADDRESS: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-gateway-api}
    networks:
      - application
      - orders-data
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "--output", "/dev/null", "http://localhost:8081/v3/api-docs"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 90s
    logging: *default-logging

  gateway-api:
    restart: unless-stopped
    build:
      context: ./gateway-api
    environment:
      GATEWAY_DB_URL: jdbc:postgresql://gateway-db:5432/gateway_db
      GATEWAY_DB_USERNAME: ${GATEWAY_DB_USERNAME:-gateway_dev}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?Set GATEWAY_DB_PASSWORD in .env}
      GATEWAY_DDL_AUTO: ${GATEWAY_DDL_AUTO:-update}
      GATEWAY_SEED_TEST_USER: ${GATEWAY_SEED_TEST_USER:-false}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ORDERS_API_URL: http://orders-api:8081
      ORDERS_API_CONNECT_TIMEOUT: ${ORDERS_API_CONNECT_TIMEOUT:-2s}
      ORDERS_API_TIMEOUT: ${ORDERS_API_TIMEOUT:-5s}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-gateway-api}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_API_PORT:-8080}:8080"
    networks:
      - application
      - auth-data
    depends_on:
      gateway-db:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "--output", "/dev/null", "http://localhost:8080/v3/api-docs"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 90s
    logging: *default-logging

networks:
  application:
    driver: bridge
  auth-data:
    internal: true
  orders-data:
    internal: true

volumes:
  gateway-postgres-data:
  orders-postgres-data:
